spring:

  application:
    name: bookingsystem

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always

jwt:
  secret: my-super-secret-key-for-jwt-authentication-booking-system
  expiration: 86400000

aws:
  region: ap-south-1

  sqs:
    booking-queue-url: ${BOOKING_QUEUE_URL:}

  ses:
    sender-email: ${SES_SENDER_EMAIL:}
