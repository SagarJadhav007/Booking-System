version: '3.9'

services:

  postgres:
    image: postgres:17
    container_name: booking-postgres

    environment:
      POSTGRES_DB: bookingdb
      POSTGRES_USER: bookinguser
      POSTGRES_PASSWORD: BookingPassword123!

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: booking-redis
    ports:
      - "6379:6379"

  booking-app:
    build: .
    container_name: booking-app
    ports:
      - "8080:8080"

    depends_on:
      - postgres
      - redis

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bookingdb
      DB_USERNAME: bookinguser
      DB_PASSWORD: bookingpass

      REDIS_HOST: redis
      REDIS_PORT: 6379

volumes:

  postgres_data: